# matugen template, rendered by DMS from the wallpaper palette.

set -g status-style "bg={{colors.surface_container.default.hex}},fg={{colors.on_surface_variant.default.hex}}"
set -g status-left "#[fg={{colors.primary.default.hex}}]λ #[fg={{colors.tertiary.default.hex}}]❯ #[fg={{colors.primary.default.hex}}]#S #[fg={{colors.outline.default.hex}}]│ "
set -g status-right "#[fg={{colors.outline.default.hex}}]│ #[fg={{colors.on_surface.default.hex}}]%H:%M #[fg={{colors.outline.default.hex}}]│ #[fg={{colors.on_surface.default.hex}}]%d.%m"

set -g window-status-format "#[fg={{colors.on_surface_variant.default.hex}}][#I:#W]"
set -g window-status-current-format "#[fg={{colors.primary.default.hex}}][#I:#W]"

set -g pane-border-style "fg={{colors.outline_variant.default.hex}}"
set -g pane-active-border-style "fg={{colors.primary.default.hex}}"

set -g message-style "bg={{colors.surface_container_high.default.hex}},fg={{colors.on_surface.default.hex}}"
set -g mode-style "bg={{colors.primary_container.default.hex}},fg={{colors.on_primary_container.default.hex}}"
