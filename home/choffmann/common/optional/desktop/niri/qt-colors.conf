# matugen template, rendered by DMS from the wallpaper palette.
#
# qt6ct expects its own palette format, not the KDE .colors scheme DMS also
# generates: 21 #aarrggbb entries per row, ordered by QPalette::ColorRole
# (WindowText, Button, Light, Midlight, Dark, Mid, Text, BrightText,
# ButtonText, Base, Window, Shadow, Highlight, HighlightedText, Link,
# LinkVisited, AlternateBase, NoRole, ToolTipBase, ToolTipText,
# PlaceholderText). Order is positional — a shifted entry silently paints
# the wrong role.

[ColorScheme]
active_colors=#ff{{colors.on_surface.default.hex_stripped}}, #ff{{colors.surface_container.default.hex_stripped}}, #ff{{colors.surface_container_highest.default.hex_stripped}}, #ff{{colors.surface_container_high.default.hex_stripped}}, #ff{{colors.surface_container_lowest.default.hex_stripped}}, #ff{{colors.outline_variant.default.hex_stripped}}, #ff{{colors.on_surface.default.hex_stripped}}, #ff{{colors.error.default.hex_stripped}}, #ff{{colors.on_surface.default.hex_stripped}}, #ff{{colors.surface_container_low.default.hex_stripped}}, #ff{{colors.surface.default.hex_stripped}}, #ff{{colors.shadow.default.hex_stripped}}, #ff{{colors.primary.default.hex_stripped}}, #ff{{colors.on_primary.default.hex_stripped}}, #ff{{colors.primary.default.hex_stripped}}, #ff{{colors.tertiary.default.hex_stripped}}, #ff{{colors.surface_container.default.hex_stripped}}, #ff{{colors.surface.default.hex_stripped}}, #ff{{colors.inverse_surface.default.hex_stripped}}, #ff{{colors.inverse_on_surface.default.hex_stripped}}, #80{{colors.outline.default.hex_stripped}}
disabled_colors=#ff{{colors.outline.default.hex_stripped}}, #ff{{colors.surface_container.default.hex_stripped}}, #ff{{colors.surface_container_highest.default.hex_stripped}}, #ff{{colors.surface_container_high.default.hex_stripped}}, #ff{{colors.surface_container_lowest.default.hex_stripped}}, #ff{{colors.outline_variant.default.hex_stripped}}, #ff{{colors.outline.default.hex_stripped}}, #ff{{colors.error.default.hex_stripped}}, #ff{{colors.outline.default.hex_stripped}}, #ff{{colors.surface_container_low.default.hex_stripped}}, #ff{{colors.surface.default.hex_stripped}}, #ff{{colors.shadow.default.hex_stripped}}, #ff{{colors.surface_container_high.default.hex_stripped}}, #ff{{colors.outline.default.hex_stripped}}, #ff{{colors.outline.default.hex_stripped}}, #ff{{colors.outline.default.hex_stripped}}, #ff{{colors.surface_container.default.hex_stripped}}, #ff{{colors.surface.default.hex_stripped}}, #ff{{colors.inverse_surface.default.hex_stripped}}, #ff{{colors.inverse_on_surface.default.hex_stripped}}, #80{{colors.outline.default.hex_stripped}}
inactive_colors=#ff{{colors.on_surface.default.hex_stripped}}, #ff{{colors.surface_container.default.hex_stripped}}, #ff{{colors.surface_container_highest.default.hex_stripped}}, #ff{{colors.surface_container_high.default.hex_stripped}}, #ff{{colors.surface_container_lowest.default.hex_stripped}}, #ff{{colors.outline_variant.default.hex_stripped}}, #ff{{colors.on_surface.default.hex_stripped}}, #ff{{colors.error.default.hex_stripped}}, #ff{{colors.on_surface.default.hex_stripped}}, #ff{{colors.surface_container_low.default.hex_stripped}}, #ff{{colors.surface.default.hex_stripped}}, #ff{{colors.shadow.default.hex_stripped}}, #ff{{colors.secondary_container.default.hex_stripped}}, #ff{{colors.on_secondary_container.default.hex_stripped}}, #ff{{colors.primary.default.hex_stripped}}, #ff{{colors.tertiary.default.hex_stripped}}, #ff{{colors.surface_container.default.hex_stripped}}, #ff{{colors.surface.default.hex_stripped}}, #ff{{colors.inverse_surface.default.hex_stripped}}, #ff{{colors.inverse_on_surface.default.hex_stripped}}, #80{{colors.outline.default.hex_stripped}}
